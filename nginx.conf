# Same-origin setup as production (vercel.json): the browser only talks to this server.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The API, served by the backend container of docker-compose.yml.
    location /api/ {
        proxy_pass http://back:8080;
        proxy_set_header Host $http_host;
        # The backend's rate limiter keys on the client IP (forward-headers-strategy: framework).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Single-page app: unknown paths load index.html and the router takes over.
    location / {
        try_files $uri /index.html;
    }
}
