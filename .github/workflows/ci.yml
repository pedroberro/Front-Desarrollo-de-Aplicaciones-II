# Type check and production build, static analysis (oxlint), dependency scan and UI tests, on every
# push, pull request and release tag.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  build:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Análisis estático (oxlint)
        run: npm run lint

      # Known vulnerabilities (OSV database) in every package of package-lock.json, direct or not.
      # Fails the build when one is found.
      - name: Escaneo de dependencias (OSV-Scanner)
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.7.0 scan source -r /src

      - name: Pruebas de UI (Vitest y Testing Library)
        run: npm test

      - name: Type check y build (tsc -b && vite build)
        run: npm run build

      - name: Imagen Docker
        run: docker build -t planta-libre-front .
